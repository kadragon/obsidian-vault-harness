name: harness-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run harness tests
        run: python3 .claude/lib/run_tests.py
      - name: Check skill documentation
        run: python3 .claude/hooks/check-skill-doc.py --sweep .
